# Test environment for GitHub Codespaces: the app plus a MariaDB database,
# matching the Node.js + MySQL/MariaDB setup planned for Hostinger.
# The database password below only exists inside this throwaway container.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so the app reaches it at 127.0.0.1.
    network_mode: service:db
    environment:
      DATABASE_URL: mysql://gcw:gcw_dev_only@127.0.0.1:3306/gcw
      NEXT_TELEMETRY_DISABLED: "1"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gcw
      MARIADB_USER: gcw
      MARIADB_PASSWORD: gcw_dev_only
      MARIADB_ROOT_PASSWORD: gcw_dev_only_root
    volumes:
      - gcw-db:/var/lib/mysql

volumes:
  gcw-db:
