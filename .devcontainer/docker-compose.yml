# Test environment for GitHub Codespaces: the app plus a MariaDB database,
# matching the Node.js + MySQL/MariaDB setup planned for Hostinger.
# The database password below only exists inside this throwaway container.
#
# The app has its own network (no network_mode: service:db). Sharing the
# database's network broke Codespaces port forwarding: the site answered
# inside the Codespace but the forwarded URL gave HTTP 502.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db
    environment:
      # "db" is the database service's name on the shared compose network.
      DATABASE_URL: mysql://gcw:gcw_dev_only@db:3306/gcw
      NEXT_TELEMETRY_DISABLED: "1"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gcw
      MARIADB_USER: gcw
      MARIADB_PASSWORD: gcw_dev_only
      MARIADB_ROOT_PASSWORD: gcw_dev_only_root
    volumes:
      - gcw-db:/var/lib/mysql

volumes:
  gcw-db:
